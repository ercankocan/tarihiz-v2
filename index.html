<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarihİz</title>

  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

  <div class="app">

    <!-- SOL MENÜ -->
    <aside class="sidebar">

      <div class="brand">
  <img
    src="assets/tarihiz-logo.png?v=2"
    alt="Tarihİz"
    class="brand-logo"
  >

  <p>Tarihin İzinde, Kanıtın Peşinde</p>
</div>

      <nav class="wizard-menu">

        <button class="nav-item active">
          <span>01</span>
          <strong>Tarihî İddia</strong>
        </button>

        <button class="nav-item">
          <span>02</span>
          <strong>Değerlendirme</strong>
        </button>

        <button class="nav-item">
          <span>03</span>
          <strong>Kaynaklar</strong>
        </button>

        <button class="nav-item">
          <span>04</span>
          <strong>Ankete Katıl</strong>
        </button>

      </nav>

      <div class="sidebar-bottom">
        <button class="about-link">
          ⓘ Hakkında
        </button>
      </div>

    </aside>


    <!-- ANA ALAN -->
    <main class="workspace">

      <!-- BANNER -->
      <section class="banner">

  <div class="banner-slides" id="bannerSlides">

    <div
      class="banner-slide active"
      style="background-image: url('assets/banner-01-genel.png');">
    </div>

    <div
      class="banner-slide"
      style="background-image: url('assets/banner-02-orta-asya.png');">
    </div>

    <div
      class="banner-slide"
      style="background-image: url('assets/banner-03-selcuklu.png');">
    </div>

    <div
      class="banner-slide"
      style="background-image: url('assets/banner-04-osmanli.png');">
    </div>

    <div
      class="banner-slide"
      style="background-image: url('assets/banner-05-cumhuriyet.png');">
    </div>

  </div>


</section>


      <!-- İDDİA GİRİŞ EKRANI -->
      <section class="page-content">

        <div class="claim-panel">

          <p class="intro">
  Tarihî iddianızı yazın. Tarihİz, yapay zekâ desteğiyle akademik literatürü
  ve web kaynaklarını araştırarak ilgili kaynakları belirler, farklı kanıtları
  karşılaştırır ve kaynaklara dayalı bir değerlendirme sunar.
</p>

          <div class="claim-input-wrapper">

            <input
              type="text"
              id="claimInput"
              placeholder="Örn. Fatih Sultan Mehmet zehirlenerek öldürüldü."
              autocomplete="off"
            >

          </div>

          <button id="researchButton" class="primary-button">
            İddiayı Araştır
            <span>→</span>
          </button>

        </div>

      </section>

    </main>

  </div>

  <script src="app.js"></script>

</body>
</html>
